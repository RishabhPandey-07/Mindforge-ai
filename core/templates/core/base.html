<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}MindForge AI{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    >

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    >
    <style>
      :root {
        --mf-ink: #0f172a;
        --mf-muted: #64748b;
        --mf-accent: #0ea5a4;
        --mf-accent-2: #f59e0b;
        --mf-surface: #ffffff;
        --mf-bg: #f8fafc;
      }
      body {
        font-family: "Space Grotesk", system-ui, -apple-system, sans-serif;
        background:
          radial-gradient(circle at top left, rgba(14,165,164,0.08), transparent 40%),
          radial-gradient(circle at top right, rgba(245,158,11,0.08), transparent 40%),
          var(--mf-bg);
        color: var(--mf-ink);
      }
      .navbar {
        backdrop-filter: blur(8px);
      }
      .btn-primary {
        background: var(--mf-accent);
        border-color: var(--mf-accent);
      }
      .text-muted {
        color: var(--mf-muted) !important;
      }
      .card {
        border-radius: 16px;
      }
      .badge-soft {
        background: rgba(14,165,164,0.12);
        color: var(--mf-accent);
        border: 1px solid rgba(14,165,164,0.2);
      }
    </style>
</head>
<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
  <div class="container">
    <a class="navbar-brand" href="{% url 'dashboard' %}">
      MindForge AI
    </a>

    <div class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto">

        {% if user.is_authenticated %}
          <li class="nav-item">
            <a class="nav-link" href="{% url 'dashboard' %}">Dashboard</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="{% url 'daily_logs:log_list' %}">Logs</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="{% url 'daily_logs:ai_summary' %}">AI Insights</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="{% url 'daily_logs:mood_trends' %}">Trends</a>
          </li>

          <li class="nav-item">
            <a class="nav-link text-danger" href="{% url 'logout' %}">Logout</a>
          </li>

        {% else %}
          <li class="nav-item">
            <a class="nav-link" href="{% url 'login' %}">Login</a>
          </li>
        {% endif %}

      </ul>
    </div>
  </div>
</nav>

<!-- PAGE CONTENT -->
<main class="container py-4">
    {% block content %}{% endblock %}
</main>

<footer class="text-center text-muted py-4">
  (c) 2026 MindForge AI - Built with Django & AI
</footer>

</body>
</html>
