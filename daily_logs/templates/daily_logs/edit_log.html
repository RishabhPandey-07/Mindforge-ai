{% extends "core/base.html" %}

{% block title %}Edit Log{% endblock %}

{% block content %}
<div class="container mt-4">

    <div class="mb-4">
        <h2 class="mb-1">Edit Daily Log</h2>
        <p class="text-muted mb-0">Refine the details of your entry.</p>
    </div>

    <form method="post">
        {% csrf_token %}

        <div class="mb-3">
            <textarea name="content"
                      class="form-control"
                      rows="6"
                      required>{{ log.content }}</textarea>
        </div>

        <button type="submit" class="btn btn-primary">
            Save Changes
        </button>

        <a href="{% url 'daily_logs:log_list' %}"
           class="btn btn-secondary">
            Cancel
        </a>
    </form>

</div>
{% endblock %}
